<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; media-src 'self' blob:">
<title>Sabretooth</title>
<link rel="stylesheet" href="styles/theme.css">
<link rel="stylesheet" href="styles/menu.css">
</head>
<!-- All visible text is filled from copy ids via data-t (see js/i18n.js). Credits names are data. -->
<body>
<div id="bg"></div><div id="snow"></div>
<div id="stage">
  <section class="screen" data-screen="root">
    <header class="title">
      <img id="logo" alt="" hidden>
      <h1 id="logo-text" data-t="app.titleLogo"></h1>
      <div class="wt" data-t="app.workingTitle"></div>
      <p id="tagline"></p>
    </header>
    <nav class="menu">
      <button data-action="continue" id="btn-continue" data-t="root.continue"></button>
      <button data-action="newGame" data-t="root.newGame"></button>
      <button data-action="load" id="btn-load" data-t="root.load"></button>
      <button data-action="settings" data-t="root.settings"></button>
      <button data-action="credits" data-t="root.credits"></button>
      <button data-action="quit" data-t="root.quit"></button>
    </nav>
  </section>
  <!-- New Game setup (spec v1.3): Style row + Death rule row (+ Sandbox panel), summary, Back/Begin.
       Focus never selects; Enter/Space/A/click selects (js/nav.js setupReduce). -->
  <section class="screen" data-screen="newGameSetup">
    <h2 data-t="newGame.title"></h2>
    <h3 class="row-title" data-t="newGame.styleRow"></h3>
    <div class="cards-row" id="style-cards"></div>
    <div class="setup-death">
      <div><h3 class="row-title" data-t="newGame.deathRuleRow"></h3><div class="cards-row" id="death-cards"></div></div>
      <div id="sandbox-panel" hidden><h3 id="sandbox-title"></h3><div id="sandbox-rows"></div><p class="note" id="sandbox-note"></p></div>
    </div>
    <p class="summary" id="setup-summary"></p>
    <div class="row setup-actions"><button data-nav="back" data-t="common.back"></button><button data-nav="begin" class="primary" data-t="difficulty.begin"></button></div>
  </section>
  <!-- Make Your Sabrecat (cat-creator-spec v0.2): step 1 Look, step 2 Personality. Panel rows are built by menu.js from js/creator.js. -->
  <section class="screen" data-screen="creator">
    <h2 data-t="creator.title"></h2>
    <p class="sub creator-sub" data-t="creator.subtitle"></p>
    <p class="creator-step" id="creator-step"></p>
    <div class="creator-body">
      <div class="creator-preview">
        <div class="portrait-frame frame-lg"><canvas id="creator-canvas" role="img" width="1152" height="864"></canvas></div>
        <button type="button" id="creator-expand" class="portrait-expand" data-g="expandCat" data-source="creator-canvas" data-t="portrait.expand"></button>
      </div>
      <div class="creator-side">
        <div class="creator-panel" id="creator-panel"></div>
        <div class="row creator-actions" id="creator-actions">
          <button data-cnav="randomize" data-t="creator.randomize"></button><button data-cnav="back" data-t="common.back"></button><button data-cnav="next" class="primary" data-t="creator.next"></button><button data-cnav="start" class="primary" data-t="creator.start"></button>
        </div>
        <p class="crow-help" id="creator-rand-help"></p>
      </div>
    </div>
    <p class="creator-hint" id="creator-hint"></p>
  </section>
  <section class="screen" data-screen="slotsFull">
    <h2 data-t="slotsFull.title"></h2><p class="sub" data-t="slotsFull.subtitle"></p>
    <div class="runs" id="replace-runs"></div>
    <div class="row"><button data-action="back" data-t="common.cancel"></button></div>
  </section>
  <section class="screen" data-screen="placeholder">
    <h2 data-t="placeholder.title"></h2><p class="sub" id="placeholder-detail"></p>
    <div class="row"><button data-action="back" data-t="common.backToMenu"></button></div>
  </section>
  <!-- Slice 1 home: clean landscape, live portrait, and the season's real actions. -->
  <section class="screen" data-screen="game">
    <div id="game-main">
      <img id="home-landscape" class="home-landscape" alt="" src="../../assets/game/home-landscape.png">
      <canvas id="home-cat" class="home-cat" width="1152" height="864"></canvas>
      <button type="button" id="hotspot-den" class="hotspot hotspot-den" data-g="den"><span data-t="home.den"></span></button>
      <button type="button" id="hotspot-wild" class="hotspot hotspot-wild" data-g="wild"><span data-t="home.wilderness"></span></button>
      <header class="home-top">
        <div class="home-brand">
          <div class="portrait-frame frame-sm"><canvas id="home-head" class="home-head" width="64" height="64"></canvas></div>
          <div>
            <p class="home-kicker" data-t="home.nav.pride"></p>
            <h1 id="home-pride-name" class="home-pride-name"></h1>
            <p class="home-player-line"><span id="home-player-name" class="home-player-name"></span><button type="button" id="home-expand" class="portrait-expand" data-g="expandCat" data-source="home-head" data-t="portrait.expand"></button></p>
          </div>
        </div>
        <div class="home-status" id="game-hud"></div>
        <div class="home-tools">
          <button type="button" data-g="save" data-t="game.action.save"></button>
          <button type="button" data-g="menu" data-t="common.mainMenu"></button>
        </div>
      </header>
      <nav id="home-nav" class="home-nav"></nav>
      <aside class="home-dock">
        <div id="home-panel"></div>
        <div class="game-actions" id="game-actions"></div>
        <div class="game-region" id="game-region"></div>
        <div class="game-report" id="game-report" hidden></div>
      </aside>
    </div>
    <div class="game-event" id="game-event" hidden></div>
  </section>
  <section class="screen" data-screen="summary">
    <div id="summary-body"></div>
    <div class="row"><button data-g="summaryMenu" class="primary" data-t="common.mainMenu"></button></div>
  </section>
  <section class="screen" data-screen="legacy">
    <h2 data-t="legacy.title"></h2><p class="sub" data-t="legacy.body"></p>
    <div class="row"><button data-action="newLineage" class="primary" data-t="legacy.newLineage"></button><button data-action="back" data-t="common.mainMenu"></button></div>
  </section>
  <section class="screen" data-screen="load">
    <h2 data-t="load.title"></h2>
    <div class="runs" id="run-list"></div>
    <div class="row"><button data-action="back" data-t="common.back"></button></div>
  </section>
  <section class="screen" data-screen="settings">
    <h2 data-t="settings.title"></h2>
    <div class="tabs" id="tabs">
      <button data-tab="audio" data-t="settings.tab.audio"></button><button data-tab="display" data-t="settings.tab.display"></button>
      <button data-tab="controls" data-t="settings.tab.controls"></button><button data-tab="storyteller" data-t="settings.tab.storyteller"></button>
    </div>
    <div id="tab-body"></div>
    <div class="row"><button data-action="back" data-t="common.back"></button><button data-action="resetTab" data-t="settings.resetTab"></button></div>
  </section>
  <section class="screen" data-screen="credits">
    <div class="credits-roll" id="credits-roll">
      <h2 data-t="credits.title"></h2><p data-t="credits.workingTitle"></p>
      <h3 data-t="credits.createdBy"></h3><p>Anna Kremer</p>
      <h3 data-t="credits.design"></h3><p>Tundra</p><h3 data-t="credits.narrative"></h3><p>Saga</p>
      <h3 data-t="credits.art"></h3><p>Ochre</p><h3 data-t="credits.engineering"></h3><p>Flint</p>
      <h3 data-t="credits.inspiredBy"></h3><p>Lioden &middot; WolfQuest</p>
      <p class="sub" data-t="credits.placeholderNote"></p>
    </div>
    <div class="row"><button data-action="back" data-t="common.back"></button></div>
  </section>
</div>
<div id="dialog" hidden><div class="box"><p id="dialog-text"></p>
  <div class="row"><button id="dialog-ok"></button><button id="dialog-cancel" data-t="common.cancel"></button></div></div></div>
<div id="cat-viewer" class="cat-viewer" hidden>
  <button type="button" class="cat-viewer-backdrop" data-g="closeViewer" aria-label="Close"></button>
  <div class="cat-viewer-box" role="dialog" aria-modal="true" aria-labelledby="cat-viewer-title">
    <h2 id="cat-viewer-title" data-t="portrait.full"></h2>
    <p id="cat-viewer-name"></p>
    <canvas id="cat-viewer-canvas"></canvas>
    <button type="button" id="cat-viewer-close" data-g="closeViewer" data-t="portrait.close"></button>
  </div>
</div>
<div id="toasts"></div>
<div id="version"></div>
<script src="js/log.js"></script>
<script src="js/i18n.js"></script>
<script src="js/nav.js"></script>
<script src="js/assets.js"></script>
<script src="js/music.js"></script>
<script src="js/compositor.js"></script>
<script src="js/portrait-view.js"></script>
<script src="js/creator.js"></script>
<script src="js/input.js"></script>
<script src="js/rng.js"></script>
<script src="js/worldmap.js"></script>
<script src="js/slice.js"></script>
<script src="js/home-scene.js"></script>
<script src="js/game-screen.js"></script>
<script src="js/menu.js"></script>
</body>
</html>
