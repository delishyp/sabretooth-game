name: Upgrade check
# Local feeds only. scripts/build-win-feed.js sets publish to never.
# Includes the non-leader first-meeting safe area and the gate nits.
# Choice rows stay fully on screen at 720.
# Headshots fill the square. One toast. Larger animals at 720.
# Per-still head boxes, ears inside, toast clear of the Lore book.
# Silent in-app step is 0.1.11 to 0.1.11-test.1.
# Region-moment gossip, the newest unknown fact, and mate den learning.
on:
  workflow_dispatch:
  push:
    branches: [cursor/s1-gossip-region-0111]
    paths:
      - package.json
      - package-lock.json
      - src/main/updater.js
      - scripts/upgrade-check.ps1
      - scripts/update-feed-server.js
      - scripts/build-win-feed.js
      - scripts/nsis-ci-log.nsh
      - .github/workflows/upgrade-check.yml
jobs:
  upgrade:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Download the published 0.1.8 installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download v0.1.8 --repo delishyp/sabretooth-game --pattern Sabretooth-Setup-0.1.8.exe --dir "$env:RUNNER_TEMP"
      - name: Install 0.1.8 the same way as the passing run
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path upgrade-evidence | Out-Null
          & ./scripts/upgrade-check.ps1 -Step install-old -Installer "$env:RUNNER_TEMP/Sabretooth-Setup-0.1.8.exe"
          if ($LASTEXITCODE -ne 0) {
            $detail = ''
            if (Test-Path upgrade-evidence/install-old.log) { $detail = (Get-Content upgrade-evidence/install-old.log -Raw).Trim() }
            "transitional-driven SKIP $detail" | Set-Content upgrade-evidence/transitional-skip.txt
            exit 0
          }
          & ./scripts/upgrade-check.ps1 -Step seed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build 0.1.11 and the unpublished 0.1.11-test.1 feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          node scripts/build-win-feed.js dist/stable
          node scripts/build-win-feed.js dist/test 0.1.11-test.1
      - name: Serve both feeds on localhost
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist/feed-stable, dist/feed-test, upgrade-evidence | Out-Null
          function Publish-Feed([string]$Src, [string]$Dest, [string]$VersionPattern, [string]$NameFile) {
            $built = @(Get-ChildItem -LiteralPath $Src -Filter '*.exe' | Where-Object { $_.Name -notmatch '__uninstaller' })
            if ($built.Count -ne 1) { throw "expected one setup exe in $Src, have: $($built.Name -join ', ')" }
            $exe = $built[0]
            $block = Get-Item -LiteralPath ($exe.FullName + '.blockmap')
            New-Item -ItemType Directory -Force -Path $Dest | Out-Null
            Copy-Item -LiteralPath $exe.FullName -Destination (Join-Path $Dest $exe.Name)
            Copy-Item -LiteralPath $block.FullName -Destination (Join-Path $Dest $block.Name)
            $channel = Join-Path $Src 'test.yml'
            $latest = Join-Path $Src 'latest.yml'
            if (Test-Path -LiteralPath $channel) { Copy-Item -LiteralPath $channel -Destination (Join-Path $Dest 'latest.yml') -Force }
            elseif (Test-Path -LiteralPath $latest) { Copy-Item -LiteralPath $latest -Destination (Join-Path $Dest 'latest.yml') -Force }
            else { throw "no yml in $Src" }
            $text = Get-Content -LiteralPath (Join-Path $Dest 'latest.yml') -Raw
            if ($text -notmatch $VersionPattern) { throw "feed $Dest version mismatch:`n$text" }
            $names = [regex]::Matches($text, '(?m)^(?:path|url):\s*[''"]?([^''"\s#]+)') | ForEach-Object { [uri]::UnescapeDataString($_.Groups[1].Value) }
            $setupName = [string]@($names | Where-Object { $_ -like '*.exe' } | Select-Object -First 1)
            if (-not $setupName) { throw "no exe url in $Dest latest.yml" }
            Copy-Item -LiteralPath $exe.FullName -Destination (Join-Path $Dest $setupName) -Force
            Copy-Item -LiteralPath $block.FullName -Destination (Join-Path $Dest ($setupName + '.blockmap')) -Force
            Set-Content -LiteralPath $NameFile -Value $setupName -NoNewline
          }
          Publish-Feed 'dist/stable' 'dist/feed-stable' '(?m)^version:\s*0\.1\.11\s*$' 'upgrade-evidence/stable-setup-name.txt'
          Publish-Feed 'dist/test' 'dist/feed-test' '(?m)^version:\s*0\.1\.11-test\.1\s*$' 'upgrade-evidence/test-setup-name.txt'
          $node = (Get-Command node).Source
          $out = (Resolve-Path upgrade-evidence).Path
          Start-Process -FilePath $node -WorkingDirectory $PWD -ArgumentList 'scripts/update-feed-server.js','8765','dist/feed-stable' -WindowStyle Hidden -RedirectStandardOutput (Join-Path $out 'feed-stable.log') -RedirectStandardError (Join-Path $out 'feed-stable.err')
          Start-Process -FilePath $node -WorkingDirectory $PWD -ArgumentList 'scripts/update-feed-server.js','8766','dist/feed-test' -WindowStyle Hidden -RedirectStandardOutput (Join-Path $out 'feed-test.log') -RedirectStandardError (Join-Path $out 'feed-test.err')
          Start-Sleep -Seconds 1
          Invoke-WebRequest http://127.0.0.1:8765/latest.yml -UseBasicParsing -OutFile upgrade-evidence/served-stable.yml
          Invoke-WebRequest http://127.0.0.1:8766/latest.yml -UseBasicParsing -OutFile upgrade-evidence/served-test.yml
      - name: Point the installed 0.1.8 at the 0.1.11 feed
        shell: pwsh
        run: |
          if (Test-Path upgrade-evidence/transitional-skip.txt) { Get-Content upgrade-evidence/transitional-skip.txt; exit 0 }
          & ./scripts/upgrade-check.ps1 -Step inventory -Label transitional -When before
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/upgrade-check.ps1 -Step rewrite-feed -Label transitional -Url http://127.0.0.1:8765
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Let 0.1.8's own updater install 0.1.11
        shell: pwsh
        run: |
          if (Test-Path upgrade-evidence/transitional-skip.txt) { Get-Content upgrade-evidence/transitional-skip.txt; exit 0 }
          # The runner kills processes when a step ends, so the feed has to be started in this step.
          $node = (Get-Command node).Source
          $out = (Resolve-Path upgrade-evidence).Path
          Start-Process -FilePath $node -WorkingDirectory $PWD -ArgumentList 'scripts/update-feed-server.js','8765','dist/feed-stable' -WindowStyle Hidden -RedirectStandardOutput (Join-Path $out 'feed-stable-live.log') -RedirectStandardError (Join-Path $out 'feed-stable-live.err')
          Start-Sleep -Seconds 1
          Invoke-WebRequest http://127.0.0.1:8765/latest.yml -UseBasicParsing -OutFile upgrade-evidence/served-stable-live.yml | Out-Null
          $setup = (Get-Content upgrade-evidence/stable-setup-name.txt -Raw).Trim()
          & ./scripts/upgrade-check.ps1 -Step watch-update -Mode transitional -Label transitional -SetupName $setup -ExpectExe 'dist/stable/win-unpacked/Sabretooth.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/upgrade-check.ps1 -Step inventory -Label transitional -When after
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Point the installed 0.1.11 at the 0.1.11-test.1 feed
        shell: pwsh
        run: |
          if (-not (Test-Path upgrade-evidence/save-sha256-before.txt)) {
            & ./scripts/upgrade-check.ps1 -Step seed
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & ./scripts/upgrade-check.ps1 -Step ensure-stable -Installer 'dist/stable/Sabretooth Setup 0.1.11.exe' -ExpectExe 'dist/stable/win-unpacked/Sabretooth.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/upgrade-check.ps1 -Step inventory -Label in-app -When before
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/upgrade-check.ps1 -Step rewrite-feed -Label in-app -Url http://127.0.0.1:8766
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Let 0.1.11 check, download, and quitAndInstall(true, true)
        shell: pwsh
        run: |
          $node = (Get-Command node).Source
          $out = (Resolve-Path upgrade-evidence).Path
          Start-Process -FilePath $node -WorkingDirectory $PWD -ArgumentList 'scripts/update-feed-server.js','8766','dist/feed-test' -WindowStyle Hidden -RedirectStandardOutput (Join-Path $out 'feed-test-live.log') -RedirectStandardError (Join-Path $out 'feed-test-live.err')
          Start-Sleep -Seconds 1
          Invoke-WebRequest http://127.0.0.1:8766/latest.yml -UseBasicParsing -OutFile upgrade-evidence/served-test-live.yml | Out-Null
          $setup = (Get-Content upgrade-evidence/test-setup-name.txt -Raw).Trim()
          & ./scripts/upgrade-check.ps1 -Step watch-update -Mode in-app -Label in-app -FeedUrl http://127.0.0.1:8766 -SetupName $setup -ExpectExe 'dist/test/win-unpacked/Sabretooth.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/upgrade-check.ps1 -Step inventory -Label in-app -When after
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assert upgrade evidence
        shell: pwsh
        run: ./scripts/upgrade-check.ps1 -Step assert
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-evidence
          path: upgrade-evidence
          if-no-files-found: warn
